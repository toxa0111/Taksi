name: APK yig'ish

on:
  workflow_dispatch: {}
  push:
    branches: [main, master, 'claude/**', 'admin/**', 'integration/**', 'feature/**']
  pull_request:
    branches: [main, 'integration/driver-trip-map-admin-settings']

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04: Android SDK shu rasmda tayyor o'rnatilgan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server testlari
        run: |
          cd server
          PORT=3999 PAY_DEV=1 ADMIN_PHONES=+998900000000 DB_FILE=/tmp/ci-db.json node server.js &
          sleep 2
          BASE=http://localhost:3999 ADMIN_PHONE=+998900000000 node test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android litsenziyalarini qabul qilish
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Yandex MapKit kalitini tekshirish
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          if [ -z "$YANDEX_MAPKIT_API_KEY" ]; then
            echo "::error::YANDEX_MAPKIT_API_KEY GitHub Actions Secret topilmadi."
            exit 1
          fi
          echo "Yandex MapKit kaliti mavjud (qiymati maxfiy)."
      - name: Debug APK yig'ish (foydalanuvchi va admin)
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: gradle assembleUserDebug assembleAdminDebug --no-daemon -PappVersionCode=${{ github.run_number }}
        working-directory: android
      - name: Android emulator smoke test (driver va admin)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/user/debug/app-user-debug.apk
            adb install -r app/build/outputs/apk/admin/debug/app-admin-debug.apk
            adb shell am force-stop uz.taksi
            adb shell am start -W -n uz.taksi/uz.taksi.MainActivity
            sleep 12
            if ! adb shell pidof uz.taksi >/dev/null; then
              adb logcat -d -t 4000 | grep -E -A 35 'FATAL EXCEPTION|AndroidRuntime|uz\\.taksi' || true
              exit 1
            fi
            adb shell am force-stop uz.taksi.admin
            adb shell am start -W -n uz.taksi.admin/uz.taksi.MainActivity
            sleep 12
            if ! adb shell pidof uz.taksi.admin >/dev/null; then
              adb logcat -d -t 4000 | grep -E -A 35 'FATAL EXCEPTION|AndroidRuntime|uz\\.taksi' || true
              exit 1
            fi
            echo 'Driver and Admin both remained alive for 12 seconds after cold launch.'
      - uses: actions/upload-artifact@v4
        with:
          name: taksi-apk
          path: android/app/build/outputs/apk/user/debug/app-user-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: toxa-admin-apk
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
      - name: APK larni nomlash
        run: |
          cp android/app/build/outputs/apk/user/debug/app-user-debug.apk taksi.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk toxa-admin.apk
      # Release faqat main'dan: boshqa branch'lar foydalanuvchilarga yangilanish chiqarmaydi.
      - name: Release (foydalanuvchi ilovasi; yangilanish shu yerdan)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taksi ${{ github.run_number }}
          files: taksi.apk
          make_latest: true
      - name: Release (TOXA Admin, alohida yangilanish kanali)
        if: startsWith(github.ref, 'refs/heads/admin/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toxa-admin
          name: TOXA Admin ${{ github.run_number }}
          files: toxa-admin.apk
          overwrite_files: true
          make_latest: false
