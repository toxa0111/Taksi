name: APK yig'ish

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04: Android SDK shu rasmda tayyor o'rnatilgan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android litsenziyalarini qabul qilish
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Debug APK yig'ish
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: taksi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK ni nomlash
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk taksi.apk
      - name: Release yaratish (ilova yangilanishi shu yerdan)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taksi ${{ github.run_number }}
          files: taksi.apk
          make_latest: true
