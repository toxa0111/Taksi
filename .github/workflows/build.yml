name: APK yig'ish

on:
  workflow_dispatch: {}
  push:
    branches: [main, master, "ui/fixed-bottom-navigation"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04: Android SDK shu rasmda tayyor o'rnatilgan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android litsenziyalarini qabul qilish
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Backend regression tests
        env:
          DEV_SMS: '1'
          PAY_DEV: '1'
          PORT: '3999'
          DB_FILE: /tmp/toxa-test-db.json
          BASE: http://127.0.0.1:3999
        run: |
          cd server
          node server.js > /tmp/toxa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3999/; then break; fi
            sleep 1
          done
          node test.js || { echo "--- server log ---"; cat /tmp/toxa-server.log; exit 1; }
      - name: Yandex MapKit kalitini tekshirish
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          if [ -z "$YANDEX_MAPKIT_API_KEY" ]; then
            echo "::error::YANDEX_MAPKIT_API_KEY GitHub Actions Secret topilmadi."
            exit 1
          fi
          echo "Yandex MapKit API key mavjud (qiymati maxfiy)."
      - name: Debug APK yig'ish
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: taksi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK ni nomlash
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ui/fixed-bottom-navigation')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk taksi.apk
      - name: Release yaratish (ilova yangilanishi shu yerdan)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ui/fixed-bottom-navigation')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TOXA ${{ github.run_number }}
          files: taksi.apk
          prerelease: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          make_latest: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
